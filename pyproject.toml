[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coworld-battlecode-2026"
version = "0.1.0"
description = "Original Battlecode 2026 JVM engine in a single episode container"
requires-python = ">=3.10"
dependencies = ["boto3>=1.35,<2", "aiohttp>=3.11,<4"]

[project.scripts]
battlecode2026 = "battlecode2026.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
